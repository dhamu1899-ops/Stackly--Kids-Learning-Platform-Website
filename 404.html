<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Page Not Found - Stackly Salem Preschool & Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="bg-gradient-to-b from-amber-50/50 via-orange-50/30 to-white text-slate-800 font-quicksand flex flex-col min-h-screen items-center justify-center p-4 sm:p-8">

  <div class="max-w-3xl w-full text-center space-y-8 my-auto">
    <!-- Animated 404 Badge -->
    <div class="relative inline-block">
      <div class="relative z-10 bg-white p-8 sm:p-12 rounded-3xl shadow-xl border-4 border-amber-300 inline-flex flex-col items-center">
        <div class="flex items-center gap-3 font-fredoka text-6xl sm:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-orange-500 via-amber-500 to-rose-500 tracking-tight">
          <span>4</span>
          <div class="w-20 h-20 sm:w-28 sm:h-28 bg-gradient-to-tr from-orange-500 to-amber-400 rounded-full flex items-center justify-center border-4 border-amber-200 shadow-md text-white my-auto animate-bounce">
            <i data-lucide="alert-circle" class="w-12 h-12 sm:w-16 sm:h-16 text-white"></i>
          </div>
          <span>4</span>
        </div>

        <div class="inline-flex items-center gap-2 bg-orange-100 text-orange-700 px-4 py-1.5 rounded-full font-fredoka text-xs font-bold mt-4 shadow-xs">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span>STACKLY KIDS • SALEM HQ 404</span>
        </div>
      </div>

      <div class="absolute -inset-4 bg-gradient-to-r from-orange-300/40 via-amber-300/40 to-rose-300/40 rounded-full blur-2xl -z-10"></div>
    </div>

    <!-- Text Details -->
    <div class="space-y-3 max-w-xl mx-auto">
      <h1 class="font-fredoka text-2xl sm:text-4xl font-bold text-slate-800">
        Oops! Page or Social Link Not Found
      </h1>
      <p class="text-slate-600 text-sm sm:text-base leading-relaxed font-quicksand">
        It looks like this page or social channel took a fun detouring playdate! Don’t worry, our Stackly Salem academy guides are here to help you navigate right back to safety.
      </p>
    </div>

    <!-- Two Action Buttons -->
    <div class="flex flex-wrap items-center justify-center gap-4 pt-2">
      <button type="button" onclick="window.goBack()" class="bg-slate-800 hover:bg-slate-900 text-white font-fredoka font-bold text-base px-8 py-4 rounded-full shadow-lg hover:shadow-slate-800/30 transition-all flex items-center gap-2.5 cursor-pointer border border-slate-700">
        <i data-lucide="arrow-left" class="w-5 h-5 text-amber-400"></i>
        <span>Go Back</span>
      </button>

      <button onclick="window.navigateTo('index.html', 'Home')" class="bg-gradient-to-r from-orange-500 via-amber-500 to-yellow-500 hover:from-orange-600 hover:to-amber-600 text-white font-fredoka font-bold text-base px-8 py-4 rounded-full shadow-xl shadow-orange-300/60 transition-all flex items-center gap-2.5 cursor-pointer border border-white/40">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span>Back to Home</span>
      </button>
    </div>

    <!-- Quick Navigation Shortcuts -->
    <div class="pt-8 border-t border-amber-200/60 max-w-xl mx-auto space-y-4">
      <span class="text-xs font-bold font-fredoka text-slate-500 uppercase tracking-wider block">
        Or Explore Popular Salem Academy Destinations:
      </span>

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <button onclick="window.navigateTo('courses.html', 'Courses')" class="p-3 bg-white hover:bg-orange-50 rounded-2xl border border-amber-100 shadow-xs hover:shadow-md transition-all text-center space-y-1 group cursor-pointer">
          <i data-lucide="graduation-cap" class="w-5 h-5 text-orange-500 mx-auto group-hover:scale-110 transition-transform"></i>
          <span class="font-fredoka text-xs font-bold text-slate-700 block">Classes</span>
        </button>

        <button onclick="window.navigateTo('events.html', 'Events')" class="p-3 bg-white hover:bg-orange-50 rounded-2xl border border-amber-100 shadow-xs hover:shadow-md transition-all text-center space-y-1 group cursor-pointer">
          <i data-lucide="calendar" class="w-5 h-5 text-sky-500 mx-auto group-hover:scale-110 transition-transform"></i>
          <span class="font-fredoka text-xs font-bold text-slate-700 block">Events</span>
        </button>

        <button onclick="window.navigateTo('teachers.html', 'Faculty')" class="p-3 bg-white hover:bg-orange-50 rounded-2xl border border-amber-100 shadow-xs hover:shadow-md transition-all text-center space-y-1 group cursor-pointer">
          <i data-lucide="compass" class="w-5 h-5 text-emerald-500 mx-auto group-hover:scale-110 transition-transform"></i>
          <span class="font-fredoka text-xs font-bold text-slate-700 block">Faculty</span>
        </button>

        <button onclick="window.navigateTo('contact.html', 'Contact')" class="p-3 bg-white hover:bg-orange-50 rounded-2xl border border-amber-100 shadow-xs hover:shadow-md transition-all text-center space-y-1 group cursor-pointer">
          <i data-lucide="phone" class="w-5 h-5 text-purple-500 mx-auto group-hover:scale-110 transition-transform"></i>
          <span class="font-fredoka text-xs font-bold text-slate-700 block">Contact</span>
        </button>
      </div>
    </div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });</script>
</body>
</html>
