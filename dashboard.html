<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Role Portal Dashboard - Stackly Salem Preschool & Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="bg-gradient-to-b from-[#FFFDF9] via-[#FFF5EA] to-[#FFEFE0] text-slate-800 font-quicksand min-h-screen flex flex-col p-4 sm:p-6">

  <!-- TOP RETURN BAR -->
  <div class="max-w-7xl w-full mx-auto mb-4 flex items-center justify-between">
    <button onclick="window.navigateTo('index.html', 'Home')" class="flex items-center gap-2 bg-white/90 backdrop-blur-md hover:bg-white text-slate-800 font-fredoka font-bold text-xs px-4 py-2 rounded-full shadow-md border border-amber-200 transition-all hover:scale-105 cursor-pointer">
      <i data-lucide="arrow-left" class="w-4 h-4 text-orange-500"></i>
      <span>← RETURN TO MAIN WEBSITE</span>
    </button>
    <a href="index.html" class="header-logo-container"></a>
  </div>

  <!-- DASHBOARD APP CONTAINER -->
  <main class="max-w-7xl w-full mx-auto flex-1 flex flex-col justify-center">
    <div id="dashboard-app-root"></div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/modals.js"></script>
  <script src="assets/js/dashboard.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });</script>
</body>
</html>
